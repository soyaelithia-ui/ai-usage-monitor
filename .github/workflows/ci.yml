name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: instabox-medium
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal web)"
      - name: Install frontend dependencies and verify Svelte 5
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Run Go unit and integration tests (zero CGo)
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 -v ./...
      - name: Compile single Go binary with embedded Svelte 5 assets
        env:
          CGO_ENABLED: '0'
        run: go build -o bin/ai-usage-monitor ./cmd/server
      - name: Install Chromium for real-browser E2E audit
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run real-browser E2E audit against single binary
        working-directory: web
        run: npm run test:e2e
  secrets:
    runs-on: instabox-medium
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner --log-opts=--all
